name = "madv-download-counter"
main = "worker.mjs"
compatibility_date = "2026-10-03"
workers_dev = true

[vars]
# Browser origin only; this is not authentication. The API still validates and
# rate-limits requests server-side.
ALLOWED_ORIGIN = "https://petgabs.github.io"

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "madv-download-counter"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
