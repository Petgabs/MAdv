<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Challenge - Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="card max-w-md w-full p-8 text-center">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">Math Quiz</h1>
            <p class="text-slate-500">Quick practice for 5th Grade</p>
        </div>

        <div id="quiz-container">
            <div id="question" class="text-2xl font-semibold mb-8 text-slate-800">
                What is 12 × 8?
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="check(86)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium">86</button>
                <button onclick="check(96)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium">96</button>
                <button onclick="check(84)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium">84</button>
                <button onclick="check(106)" class="p-4 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium">106</button>
            </div>

            <div id="feedback" class="h-8 font-medium"></div>
        </div>

        <button onclick="location.reload()" class="mt-4 text-sm text-slate-400 hover:text-indigo-600">Restart Quiz</button>
    </div>

    <script>
        function check(answer) {
            const feedback = document.getElementById('feedback');
            if (answer === 96) {
                feedback.textContent = "✅ Correct! Well done!";
                feedback.className = "h-8 font-medium text-green-600";
            } else {
                feedback.textContent = "❌ Try again!";
                feedback.className = "h-8 font-medium text-red-600";
            }
        }
    </script>
</body>
</html>
